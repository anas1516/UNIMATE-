<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unimate — Find Your Uni Buddy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
font-family:Arial;
background:radial-gradient(circle at 10% 10%,#172554,transparent 30%),
radial-gradient(circle at 90% 20%,#312e81,transparent 30%),
radial-gradient(circle at 50% 100%,#164e63,transparent 35%),#050816;
color:#fff;overflow-x:hidden
}
nav{
padding:20px 7%;display:flex;justify-content:space-between;align-items:center;
position:sticky;top:0;z-index:9;background:#050816c9;
backdrop-filter:blur(18px);border-bottom:1px solid #ffffff14
}
.logo{font-size:28px;font-weight:900}
.logo span,h1 span{color:#67e8f9}
.nav{display:flex;gap:28px;list-style:none;align-items:center}
.nav a,.social a{color:#dbeafe;text-decoration:none;font-weight:700}
.hero{
min-height:90vh;padding:70px 7%;display:flex;align-items:center;
justify-content:space-between;gap:40px
}
.text{max-width:650px}
.badge{
display:inline-block;padding:10px 18px;border-radius:30px;
background:#67e8f91a;border:1px solid #67e8f959;color:#67e8f9;margin-bottom:25px
}
.hero h1{font-size:clamp(48px,8vw,90px);line-height:.95;margin-bottom:25px}
.hero p{color:#b8c4d9;font-size:19px;line-height:1.7;margin-bottom:30px}
.buttons{display:flex;gap:15px;flex-wrap:wrap}
.btn{
padding:15px 24px;border-radius:14px;text-decoration:none;font-weight:800;
display:inline-block;transition:.3s
}
.primary{
background:linear-gradient(135deg,#22d3ee,#6366f1);color:#fff;
box-shadow:0 15px 35px #22d3ee40
}
.secondary{border:1px solid #ffffff2e;background:#ffffff0f;color:#fff}
.btn:hover,.card:hover,.feature:hover{transform:translateY(-8px)}
.visual{
width:380px;height:380px;display:grid;place-items:center;position:relative
}
.planet{
width:260px;height:260px;border-radius:50%;
background:radial-gradient(circle at 30% 25%,#a5f3fc,transparent 8%),
radial-gradient(circle at 65% 35%,#6366f1,transparent 12%),
linear-gradient(135deg,#164e63,#312e81);
box-shadow:inset -35px -25px 60px #0009,0 0 70px #22d3ee59;
animation:f 5s infinite
}
.ring,.orbit{position:absolute;border-radius:50%}
.ring{
width:360px;height:120px;border:2px solid #67e8f980;
transform:rotate(-20deg);animation:s 8s linear infinite
}
.orbit{
width:320px;height:320px;border:1px dashed #ffffff30;
animation:s 15s linear infinite
}
@keyframes f{50%{transform:translateY(-18px)}}
@keyframes s{to{transform:rotate(360deg)}}

section{padding:80px 7%}
.title{text-align:center;margin-bottom:45px}
.title h2,.community h2{font-size:44px;margin-bottom:12px}
.title p,.community p,.about p{color:#aebbd0}

.countries,.features{
display:grid;grid-template-columns:repeat(4,1fr);gap:20px
}
.card,.feature{
padding:28px;border-radius:24px;
background:linear-gradient(145deg,#ffffff1f,#ffffff09);
border:1px solid #ffffff1f;backdrop-filter:blur(15px);
transition:.4s;box-shadow:0 20px 40px #0004
}
.card{min-height:190px}
.flag{font-size:42px;margin-bottom:12px}
.card h3,.feature h3{margin-bottom:8px;font-size:22px}
.card p,.feature p{color:#aebbd0;line-height:1.5}
.features{grid-template-columns:repeat(3,1fr)}
.feature-icon{font-size:38px;margin-bottom:15px}

.community{
margin:20px 7% 80px;padding:65px 25px;text-align:center;
border-radius:35px;background:linear-gradient(135deg,#22d3ee21,#6366f129);
border:1px solid #ffffff1f
}
.community p{max-width:650px;margin:0 auto 28px;line-height:1.7}
.about{max-width:850px;margin:auto;text-align:center}
.about p{font-size:18px;line-height:1.8}
footer{
padding:35px 7%;text-align:center;border-top:1px solid #ffffff14;color:#8fa0b8
}
.social{margin-bottom:18px}
.social a{margin:0 10px}

.auth-btn{cursor:pointer;border:0}
.auth-overlay{
position:fixed;inset:0;background:#020617cc;backdrop-filter:blur(12px);
display:none;align-items:center;justify-content:center;z-index:99;padding:20px
}
.auth-box{
width:min(460px,100%);background:linear-gradient(145deg,#111a35,#07101f);
border:1px solid #ffffff20;border-radius:26px;padding:28px;
box-shadow:0 30px 80px #0009
}
.auth-box h2{font-size:30px;margin-bottom:8px}
.auth-sub{color:#9fb0c8;margin-bottom:22px}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px}
.auth-tabs button{
flex:1;padding:11px;border:1px solid #ffffff18;background:#ffffff09;
color:#fff;border-radius:10px;cursor:pointer;font-weight:700
}
.auth-tabs .active{background:#22d3ee;color:#04111d}
.auth-box input,.auth-box select,.auth-box textarea{
width:100%;padding:13px;margin:7px 0;border:1px solid #ffffff18;
border-radius:11px;background:#020617;color:#fff;outline:none
}
.auth-box textarea{min-height:80px;resize:vertical}
.auth-submit{width:100%;margin-top:10px;border:0;cursor:pointer}
.close-auth{
float:right;background:none;border:0;color:#aebbd0;font-size:24px;cursor:pointer
}
.auth-msg{min-height:22px;color:#67e8f9;margin-top:10px;font-size:14px}
.user-menu{display:none;gap:8px;align-items:center}
.user-name{color:#67e8f9;font-weight:800}

/* ADMIN */
.admin-panel{
display:none;padding:70px 7%;min-height:80vh
}
.admin-title{text-align:center;margin-bottom:35px}
.admin-title h2{font-size:44px;margin-bottom:10px}
.admin-title p{color:#aebbd0}

.admin-grid{
display:grid;grid-template-columns:repeat(3,1fr);
gap:20px;margin-bottom:35px
}
.admin-stat{
padding:25px;border-radius:20px;
background:linear-gradient(145deg,#ffffff1f,#ffffff09);
border:1px solid #ffffff1f;
box-shadow:0 20px 40px #0004
}
.admin-stat h3{font-size:15px;color:#9fb0c8;margin-bottom:10px}
.admin-stat strong{font-size:38px;color:#67e8f9}

.country-counts{
display:flex;flex-wrap:wrap;gap:10px;margin-bottom:35px
}
.country-count{
padding:12px 17px;border-radius:12px;
background:#ffffff10;border:1px solid #ffffff12
}

.admin-search{
width:100%;padding:14px;margin-bottom:18px;
border-radius:12px;border:1px solid #ffffff20;
background:#020617;color:#fff;outline:none
}

.table-wrap{
overflow-x:auto;border-radius:18px;
border:1px solid #ffffff12
}
.admin-table{
width:100%;border-collapse:collapse;
background:#ffffff09;min-width:900px
}
.admin-table th,.admin-table td{
padding:14px;text-align:left;
border-bottom:1px solid #ffffff12
}
.admin-table th{
color:#67e8f9;background:#ffffff09
}
.admin-table td{color:#dbeafe}

.admin-empty{
text-align:center;padding:30px;color:#9fb0c8
}

@media(max-width:1000px){
.hero{flex-direction:column;text-align:center}
.buttons{justify-content:center}
.countries{grid-template-columns:repeat(2,1fr)}
.features{grid-template-columns:1fr}
}

@media(max-width:800px){
.admin-grid{grid-template-columns:1fr}
}

@media(max-width:600px){
.nav{display:none}
.hero{padding:55px 5%}
.visual{width:300px;height:300px}
.planet{width:200px;height:200px}
.ring{width:280px}
section{padding:60px 5%}
.countries{grid-template-columns:1fr}
.community{margin:15px 5% 60px}
.title h2,.community h2,.admin-title h2{font-size:34px}
.user-name{display:none}
}
</style>
</head>

<body>

<div class="logo">Uni<span>mate</span> 🌍</div>
